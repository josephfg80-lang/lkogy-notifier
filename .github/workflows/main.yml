name: LKOGY Notifier

on:
  schedule:
    # كل 10 دقايق — يكفي للمنتجات الجديدة وللتذكيرات اليومية
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # زرار يدوي للتشغيل من واجهة GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lkogy-notifier
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run notifier (products + reminders)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js
